name: bundle

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The importer wants the metainfo file, config/ and data/ at the zip root, with no symlinks.
      - name: Zip the bundle
        run: zip -r -X windows-xp.zip com.system76.CosmicThemeBundle.windows-xp.metainfo.xml config data LICENSE NOTICE.md LICENSES

      - name: Build the Firefox theme
        run: (cd firefox && zip -X ../windows-xp-firefox.xpi manifest.json)

      # One release per x-cosmic-version in the metainfo. Pushes without a version bump
      # replace the zip on the existing release, so releases/latest always has master.
      - name: Publish release
        run: |
          tag="v$(grep -oP '(?<=key="x-cosmic-version">)[^<]+' com.system76.CosmicThemeBundle.windows-xp.metainfo.xml)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" windows-xp.zip windows-xp-firefox.xpi --clobber
          else
            gh release create "$tag" windows-xp.zip windows-xp-firefox.xpi --title "Windows XP $tag" \
              --notes "COSMIC theme bundle. Import windows-xp.zip from Settings → Desktop → Appearance."
          fi
